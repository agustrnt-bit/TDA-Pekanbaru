services:
  postgres:
    image: postgres:17-bookworm
    container_name: tda-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - tda_staging_pgdata:/var/lib/postgresql/data
      - /srv/tda-staging/backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - tda_staging_internal

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.staging
    container_name: tda-staging-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TDA_RUNTIME: vps
      PORT: 3000
      HOST: 0.0.0.0
      TZ: Asia/Jakarta
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_PATH: /data/uploads
      PG_POOL_MAX: 10
      APP_ORIGIN: ${APP_ORIGIN}
      AUTH_SESSION_SECRET_FILE: /run/secrets/auth_session_secret
      AUTH_PASSWORD_PEPPER_FILE: /run/secrets/auth_password_pepper
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
    volumes:
      - /srv/tda-staging/storage/uploads:/data/uploads
      - /srv/tda-staging/logs:/app/logs
    ports:
      - "127.0.0.1:3001:3000"
    secrets:
      - auth_session_secret
      - auth_password_pepper
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const n=require('net').connect(3000,'127.0.0.1'); n.on('connect',()=>process.exit(0)); n.on('error',()=>process.exit(1));\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - tda_staging_internal

networks:
  tda_staging_internal:
    name: tda-staging-internal

volumes:
  tda_staging_pgdata:
    name: tda-staging-pgdata

secrets:
  auth_session_secret:
    file: /srv/tda-staging/env/auth_session_secret
  auth_password_pepper:
    file: /srv/tda-staging/env/auth_password_pepper
