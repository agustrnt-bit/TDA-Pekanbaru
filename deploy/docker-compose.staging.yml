services:
  postgres:
    image: postgres:17-bookworm
    container_name: tda-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - tda_staging_pgdata:/var/lib/postgresql/data
      - /srv/tda-staging/backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - tda_staging_internal

networks:
  tda_staging_internal:
    name: tda-staging-internal

volumes:
  tda_staging_pgdata:
    name: tda-staging-pgdata
